name: Release

# Se dispara por tag, no por push a main: publicar es un acto deliberado y no
# un efecto secundario de mergear. El tag es la decisión.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Sin esto npm no puede firmar la procedencia. Es el permiso que convierte
  # este workflow en algo verificable: liga el tarball a este commit y a este
  # archivo. Ojo, la procedencia SOLO funciona con el repositorio público; en
  # uno privado npm falla con "Only public source repositories are supported".
  id-token: write

jobs:
  publicar:
    name: Publicar en npm con procedencia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # Un tag que no coincide con la version publica algo que nadie pidió, y
      # en npm una version no se puede reusar: el error no se deshace. Se corta
      # acá, antes de construir nada.
      - name: El tag coincide con la version del package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "El tag dice $TAG y el package.json dice $PKG."
            exit 1
          fi
          echo "Publicando $PKG"

      # Las mismas puertas que el CI de todos los días: tipos, los 21 tests y
      # la auditoría del árbol heredado. Se repiten a propósito, porque un tag
      # puede apuntar a un commit que el CI nunca vio.
      - run: npm run check

      # El trusted publishing exige npm >= 11.5.1, y la que trae Node 24 puede
      # ser anterior. Sin esto el publish cae de nuevo al camino del token y
      # falla pidiendo credenciales que ya no existen.
      - name: npm al día (requisito del trusted publishing)
        run: |
          npm install -g npm@latest
          npm --version

      # Sin token. Desde el 2026-08-27 la autenticación es **trusted publishing**:
      # npm reconoce el OIDC de este workflow (de ahí `id-token: write` arriba) y
      # emite una credencial efímera, atada a este repositorio y a este archivo,
      # que no se puede copiar ni reutilizar fuera de acá.
      #
      # Reemplaza al token granular que publicó la 0.1.0. Ese token tenía que
      # llevar «bypass 2FA» para funcionar sin que nadie tipeara un código, o sea
      # que era una credencial de larga vida, con permiso de escritura sobre todo
      # el scope y capaz de saltear el segundo factor. Se creó con 7 días de vida
      # a propósito y se revocó al configurar esto.
      #
      # Requisito que no está acá y hay que saber: en npmjs.com, en Settings del
      # paquete → Trusted publishing, tiene que figurar este repo y el nombre
      # EXACTO de este archivo (`release.yml`). Si se renombra el workflow, el
      # publish deja de autenticar.
      - name: npm publish
        run: npm publish --access public --provenance
