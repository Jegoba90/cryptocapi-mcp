name: Release

# Se dispara por tag, no por push a main: publicar es un acto deliberado y no
# un efecto secundario de mergear. El tag es la decisión.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Sin esto npm no puede firmar la procedencia. Es el permiso que convierte
  # este workflow en algo verificable: liga el tarball a este commit y a este
  # archivo. Ojo, la procedencia SOLO funciona con el repositorio público; en
  # uno privado npm falla con "Only public source repositories are supported".
  id-token: write

jobs:
  publicar:
    name: Publicar en npm con procedencia
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # Un tag que no coincide con la version publica algo que nadie pidió, y
      # en npm una version no se puede reusar: el error no se deshace. Se corta
      # acá, antes de construir nada.
      - name: El tag coincide con todas las versiones declaradas
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "El tag dice $TAG y el package.json dice $PKG."
            exit 1
          fi

          # server.json declara la version DOS veces y hasta ahora no la miraba
          # nadie: se bumpea a mano, asi que podia quedar atras sin que nada lo
          # notara. Paso de hecho entre la 0.2.3 y el commit que la corrigio, que
          # quedo despues del tag y por lo tanto fuera de lo publicado.
          SRV="$(node -p "require('./server.json').version")"
          SRV_PKG="$(node -p "require('./server.json').packages[0].version")"
          if [ "$TAG" != "$SRV" ] || [ "$TAG" != "$SRV_PKG" ]; then
            echo "El tag dice $TAG y server.json dice $SRV (paquete: $SRV_PKG)."
            exit 1
          fi

          echo "Publicando $PKG, con server.json alineado"

      # Las mismas puertas que el CI de todos los días: tipos, la suite entera y
      # la auditoría del árbol heredado. Se repiten a propósito, porque un tag
      # puede apuntar a un commit que el CI nunca vio.
      - run: npm run check

      # El trusted publishing exige npm >= 11.5.1, y la que trae Node 24 puede
      # ser anterior. Sin esto el publish cae de nuevo al camino del token y
      # falla pidiendo credenciales que ya no existen.
      - name: npm al día (requisito del trusted publishing)
        run: |
          npm install -g npm@latest
          npm --version

      # Sin token. Desde el 2026-08-27 la autenticación es **trusted publishing**:
      # npm reconoce el OIDC de este workflow (de ahí `id-token: write` arriba) y
      # emite una credencial efímera, atada a este repositorio y a este archivo,
      # que no se puede copiar ni reutilizar fuera de acá.
      #
      # Reemplaza al token granular que publicó la 0.1.0. Ese token tenía que
      # llevar «bypass 2FA» para funcionar sin que nadie tipeara un código, o sea
      # que era una credencial de larga vida, con permiso de escritura sobre todo
      # el scope y capaz de saltear el segundo factor. Se creó con 7 días de vida
      # a propósito y se revocó al configurar esto.
      #
      # Requisito que no está acá y hay que saber: en npmjs.com, en Settings del
      # paquete → Trusted publishing, tiene que figurar este repo y el nombre
      # EXACTO de este archivo (`release.yml`). Si se renombra el workflow, el
      # publish deja de autenticar.
      - name: npm publish
        run: npm publish --access public --provenance

  # El MCP Registry no se entera solo de una versión nueva en npm: hay que
  # mandarle el server.json. Era un paso a mano y se olvidó con la 0.2.4, que
  # estuvo cinco días en npm mientras el Registry seguía anunciando la 0.2.3.
  #
  # Va en un job aparte a propósito. Si el Registry falla, «Re-run failed jobs»
  # reintenta solo esto; en el mismo job el reintento volvería a pasar por
  # `npm publish`, y npm rechaza una versión que ya existe.
  registry:
    name: Publicar en el MCP Registry
    needs: publicar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Versión fija y checksum verificado, por lo mismo que la imagen fija: un
      # binario que baja de «latest» cambia sin que nadie lo decida.
      - name: Instalar mcp-publisher 1.8.1
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      # Sin token, con el mismo `id-token: write` que usa npm: el Registry
      # acepta el OIDC de un workflow de este dueño para el namespace
      # io.github.Jegoba90.
      - name: Login con el OIDC del workflow
        run: ./mcp-publisher login github-oidc

      # El Registry acepta la versión solo si el paquete ya está en npm con el
      # mismo mcpName, y npm puede tardar unos segundos en servir lo que se
      # acaba de publicar. Tres intentos antes de dar el job por fallido.
      - name: Publicar server.json
        run: |
          for intento in 1 2 3; do
            ./mcp-publisher publish && exit 0
            echo "Intento $intento falló; reintento en 20 s."
            sleep 20
          done
          exit 1
